name: Run Unit Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Test PBKDF2
        run: dotnet test Test.Canducci.GeneratePassword/Test.Canducci.GeneratePassword.csproj --configuration Release --no-restore

      - name: Test Argon2id
        run: dotnet test Test.Canducci.GeneratePassword.Argon2id/Test.Canducci.GeneratePassword.Argon2id.csproj --configuration Release --no-restore